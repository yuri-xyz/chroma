[package]
name = "term-shaders"
version = "0.1.0"
edition = "2024"

[dependencies]
# GPU/Graphics
wgpu = "22.1"
pollster = "0.3"
bytemuck = { version = "1.14", features = ["derive"] }
glam = "0.29"

# Terminal/UI
crossterm = "0.28"

# Audio (optional feature)
cpal = { version = "0.15", optional = true }
rustfft = { version = "6.2", optional = true }

# Utilities
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
flume = "0.11"
rand = "0.8"

[dev-dependencies]
criterion = "0.5"
pollster = { version = "0.3", features = ["macro"] }

[features]
default = []
audio = ["cpal", "rustfft"]

[[bin]]
name = "term-shaders"
path = "src/main.rs"

[lib]
name = "term_shaders"
path = "src/lib.rs"
