[package]
name = "chroma"
version = "0.1.0"
edition = "2021"
authors = ["user <email>"]
description = "🌈 Shader-based audio visualizer for the terminal."
license = "MIT"
repository = "https://github.com/yuri-xyz/chroma"

[dependencies]
# GPU/Graphics
wgpu = "29.0.1"
pollster = "0.4.0"
bytemuck = { version = "1.25.0", features = ["derive"] }

# Terminal/UI
crossterm = "0.29.0"

# Audio
# NOTE: cpal 0.17+ required for macOS loopback audio support (macOS 14.6+)
cpal = "0.17.3"
rustfft = "6.4.1"

# Utilities
anyhow = "1.0.102"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
flume = "0.12.0"
rand = "0.10.1"
unicode-width = "0.2.2"
clap = { version = "4.6.1", features = ["derive"] }
sha2 = "0.11.0"
notify = "9.0.0-rc.3"

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30.1"
libpulse-simple-binding = "2.29.0"

[dev-dependencies]
criterion = "0.8.2"
pollster = { version = "0.4.0", features = ["macro"] }

[[bin]]
name = "chroma"
path = "src/main.rs"

[lib]
name = "chroma"
path = "src/lib.rs"

[package.metadata.deb]
depends = "libvulkan1, libasound2, libpulse0"
